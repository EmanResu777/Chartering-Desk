name: Dependency Remediation

on:
  push:
    branches:
      - hardening/production-p0-2026-09-22
    paths:
      - ".github/workflows/dependency-remediation.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: CI_SECRET_MUST_NEVER_REACH_BROWSER_9d7f1a
      APP_BASE_URL: https://example.invalid
      TRUST_PROXY_HOPS: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/production-p0-2026-09-22

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking npm security fixes
        run: npm audit fix --package-lock-only || true

      - name: Reinstall remediated lockfile
        run: npm ci

      - name: Verify TypeScript
        run: npm run lint

      - name: Verify production build
        run: npm run build

      - name: Require no high or critical production advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Commit remediated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "security: remediate npm dependency advisories"
          git push origin HEAD:hardening/production-p0-2026-09-22
