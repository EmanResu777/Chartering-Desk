name: Dependency Refresh

on:
  push:
    branches:
      - hardening/production-p0-2026-09-22

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/production-p0-2026-09-22

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking security updates
        run: npm audit fix

      - name: Verify updated dependency graph
        run: |
          npm run lint
          npm run build
          node --test tests/security/*.test.cjs
          npx tsx --test tests/unit/*.test.ts

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: refresh vulnerable dependencies"
          git push origin HEAD:hardening/production-p0-2026-09-22
